<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Meu Site</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
      background: linear-gradient(135deg, #111827, #2563eb);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .caixa {
      width: 100%;
      max-width: 600px;
      padding: 40px 25px;
      text-align: center;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 22px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
    }

    h1 {
      font-size: 38px;
      margin-bottom: 15px;
    }

    p {
      font-size: 19px;
      line-height: 1.5;
      margin-bottom: 28px;
    }

    .botao {
      display: inline-block;
      padding: 15px 28px;
      color: #1d4ed8;
      background: white;
      text-decoration: none;
      font-weight: bold;
      border-radius: 12px;
    }

    .botao:active {
      transform: scale(0.97);
    }
  </style>
</head>

<body>
  <main class="caixa">
    <h1>Meu site está online! 🚀</h1>

    <p>
      Esta é a primeira versão do meu site.
      Em breve teremos muitas novidades.
    </p>

    <a class="botao" href="https://wa.me/" target="_blank">
      Fale comigo
    </a>
  </main>
</body>
</html>
