<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="40 ferramentas online gratuitas para cálculos, textos, conversões, geradores e produtividade.">
  <meta name="keywords" content="ferramentas online, calculadora, conversor, gerador de senha, contador de palavras, QR Code">
  <meta name="theme-color" content="#2563eb">
  <meta property="og:title" content="Ferramentas Pro">
  <meta property="og:description" content="40 ferramentas rápidas, gratuitas e fáceis de usar pelo celular.">
  <meta property="og:type" content="website">
  <title>Ferramentas Pro — Versão 6</title>
  <style>
    :root{--bg:#f4f7fb;--card:#fff;--text:#14213d;--muted:#64748b;--primary:#2563eb;--primary2:#7c3aed;--border:#dbe4f0;--shadow:0 10px 30px rgba(15,23,42,.08);--ok:#15803d;--danger:#dc2626}
    body.dark{--bg:#0f172a;--card:#182235;--text:#f8fafc;--muted:#a8b3c7;--border:#2a3952;--shadow:0 10px 30px rgba(0,0,0,.25)}
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);transition:.2s}
    header{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;padding:34px 16px 28px;text-align:center}
    header h1{margin:0;font-size:clamp(30px,7vw,50px)}
    header p{margin:8px auto 0;max-width:760px;opacity:.94}
    .topbar{max-width:1180px;margin:-18px auto 18px;padding:0 16px;display:flex;gap:10px}
    .search{flex:1;padding:15px 18px;border:1px solid var(--border);border-radius:16px;background:var(--card);color:var(--text);box-shadow:var(--shadow);font-size:16px}
    .iconbtn{border:0;border-radius:16px;background:var(--card);color:var(--text);box-shadow:var(--shadow);padding:0 17px;font-size:21px;cursor:pointer}
    .wrap{max-width:1180px;margin:auto;padding:0 16px 44px}
    .stats,.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:16px}
    .pill,.filter{background:var(--card);border:1px solid var(--border);padding:9px 13px;border-radius:999px;color:var(--muted)}
    .filter{cursor:pointer;font-weight:700}
    .filter.active{background:var(--primary);color:#fff;border-color:var(--primary)}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
    .card{position:relative;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:18px;box-shadow:var(--shadow);cursor:pointer;transition:.2s}
    .card:hover{transform:translateY(-4px);border-color:#93b4f5}
    .fav{position:absolute;right:14px;top:12px;border:0;background:transparent;font-size:26px;cursor:pointer}
    .card .emoji{font-size:34px}.card h3{margin:10px 35px 6px 0}.card p{margin:0;color:var(--muted);font-size:14px;line-height:1.45}
    .tag{display:inline-block;margin-top:12px;padding:5px 9px;border-radius:999px;background:rgba(37,99,235,.1);color:var(--primary);font-size:12px;font-weight:700}
    .empty{grid-column:1/-1;text-align:center;padding:40px;color:var(--muted)}
    .modal{position:fixed;inset:0;background:rgba(2,6,23,.7);display:none;align-items:center;justify-content:center;padding:16px;z-index:99}
    .modal.open{display:flex}.dialog{width:min(650px,100%);max-height:92vh;overflow:auto;background:var(--card);border-radius:22px;padding:20px;border:1px solid var(--border);box-shadow:0 30px 80px rgba(0,0,0,.35)}
    .dialog-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.dialog-head h2{margin:0}.close{border:0;background:transparent;color:var(--text);font-size:30px;cursor:pointer}
    .tool{margin-top:18px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    label{display:block;margin:10px 0 6px;font-weight:700;font-size:14px}input,select,textarea,button{font:inherit}
    input,select,textarea{width:100%;padding:12px;border:1px solid var(--border);border-radius:12px;background:var(--bg);color:var(--text)}
    textarea{min-height:120px;resize:vertical}.btn{margin-top:12px;border:0;border-radius:12px;background:var(--primary);color:#fff;padding:12px 16px;font-weight:800;cursor:pointer}
    .btn.secondary{background:#475569}.btn.danger{background:var(--danger)}.result{margin-top:14px;padding:14px;border-radius:14px;background:var(--bg);border:1px dashed var(--border);white-space:pre-wrap;word-break:break-word;min-height:48px}
    .actions{display:flex;gap:8px;flex-wrap:wrap}.history{margin:24px 0;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px}.history h2{margin-top:0;font-size:20px}.history-list{display:flex;gap:8px;flex-wrap:wrap}.history button{border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:999px;padding:8px 11px;cursor:pointer}
    footer{text-align:center;padding:24px;color:var(--muted)}

    .popular{margin:18px 0;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
    .popular h2{margin:0 0 12px;font-size:20px}
    .popular-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
    .popular-item{background:var(--bg);border:1px solid var(--border);border-radius:14px;padding:12px;cursor:pointer;color:var(--text);text-align:left}
    .popular-item strong{display:block;margin-bottom:4px}
    .popular-item small{color:var(--muted)}
    .usage{display:inline-block;margin-left:8px;padding:4px 8px;border-radius:999px;background:rgba(21,128,61,.1);color:var(--ok);font-size:11px;font-weight:800}
    .hero-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:14px}
    .hero-btn{border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.15);color:#fff;padding:9px 13px;border-radius:999px;font-weight:800;cursor:pointer}

    @media(max-width:600px){.row,.row3{grid-template-columns:1fr}.dialog{padding:16px}.topbar{margin-top:-12px}.iconbtn{padding:0 14px}}
  </style>
</head>
<body>
<header>
  <h1>Ferramentas Pro</h1>
  <p>40 ferramentas rápidas, gratuitas e fáceis de usar no celular.</p>
  <div class="hero-actions">
    <button class="hero-btn" onclick="document.getElementById('busca').focus()">🔎 Encontrar ferramenta</button>
    <button class="hero-btn" onclick="document.getElementById('ranking').scrollIntoView({behavior:'smooth'})">🏆 Mais usadas</button>
  </div>
</header>

<div class="topbar">
  <input id="busca" class="search" placeholder="Pesquisar ferramenta..." aria-label="Pesquisar ferramenta">
  <button class="iconbtn" id="favoritosBtn" title="Mostrar favoritos">⭐</button>
  <button class="iconbtn" id="tema" title="Mudar tema">🌙</button>
</div>

<main class="wrap">
  <div class="stats">
    <span class="pill"><strong>40</strong> ferramentas</span>
    <span class="pill">Sem cadastro</span>
    <span class="pill">Funciona no celular</span>
    <span class="pill">Versão 6</span>
  </div>
  <div id="filters" class="filters"></div>
  <section id="grid" class="grid"></section>

  <section id="ranking" class="popular">
    <h2>🏆 Ferramentas mais usadas</h2>
    <div id="popularList" class="popular-list"></div>
  </section>

  <section class="history">
    <h2>🕘 Usadas recentemente</h2>
    <div id="historyList" class="history-list">Nenhuma ferramenta usada ainda.</div>
  </section>
</main>

<footer>© 2026 Ferramentas Pro — Versão 6.0</footer>

<div id="modal" class="modal" aria-hidden="true">
  <div class="dialog">
    <div class="dialog-head">
      <h2 id="tituloModal">Ferramenta</h2>
      <button class="close" id="fechar" aria-label="Fechar">×</button>
    </div>
    <div id="conteudoModal" class="tool"></div>
    <div class="actions">
      <button class="btn secondary" id="copiarBtn">📋 Copiar resultado</button>
      <button class="btn secondary" id="compartilharBtn">📱 Compartilhar</button>
    </div>
  </div>
</div>

<script>
const ferramentas=[
['imc','🧍','Calculadora de IMC','Descubra seu índice de massa corporal.','Calculadoras'],
['porcentagem','％','Calculadora de porcentagem','Calcule percentuais rapidamente.','Calculadoras'],
['desconto','🏷️','Calculadora de desconto','Veja o preço final após o desconto.','Calculadoras'],
['regra3','📐','Regra de três','Resolva proporções simples.','Calculadoras'],
['juros','📈','Juros compostos','Simule crescimento do dinheiro.','Financeiro'],
['emprestimo','💳','Simulador de empréstimo','Calcule parcelas aproximadas.','Financeiro'],
['idade','🎂','Calculadora de idade','Calcule sua idade exata.','Datas'],
['dias','📅','Diferença entre datas','Conte dias entre duas datas.','Datas'],
['caracteres','🔤','Contador de caracteres','Conte letras e caracteres.','Texto'],
['palavras','📝','Contador de palavras','Conte palavras e linhas.','Texto'],
['maiusculas','🔠','Maiúsculas e minúsculas','Transforme seu texto.','Texto'],
['espacos','🧹','Remover espaços extras','Limpe espaços duplicados.','Texto'],
['ordenar','↕️','Ordenar linhas','Organize linhas em ordem alfabética.','Texto'],
['base64','🧬','Codificador Base64','Codifique ou decodifique textos.','Desenvolvimento'],
['url','🔗','Codificador de URL','Codifique ou decodifique URLs.','Desenvolvimento'],
['senha','🔐','Gerador de senha','Crie senhas fortes.','Geradores'],
['uuid','🆔','Gerador de UUID','Gere identificadores únicos.','Geradores'],
['numero','🎲','Número aleatório','Sorteie um número.','Geradores'],
['loteria','🍀','Números da Mega-Sena','Gere 6 números aleatórios.','Geradores'],
['cpfgerar','🪪','Gerador de CPF','Gere CPF válido para testes.','Geradores'],
['cpfvalidar','✅','Validador de CPF','Verifique se um CPF é válido.','Utilidades'],
['temperatura','🌡️','Conversor de temperatura','Celsius, Fahrenheit e Kelvin.','Conversores'],
['comprimento','📏','Conversor de comprimento','Metros, quilômetros e milhas.','Conversores'],
['peso','⚖️','Conversor de peso','Quilos, gramas e libras.','Conversores'],
['dados','💾','Conversor de dados','Bytes, KB, MB e GB.','Conversores'],
['cronometro','⏱️','Cronômetro','Marque o tempo.','Tempo'],
['temporizador','⏳','Temporizador','Crie uma contagem regressiva.','Tempo'],
['qrcode','▦','Gerador de QR Code','Crie um QR Code para texto ou link.','Utilidades'],
['pix','💸','Gerador de PIX','Gere código PIX Copia e Cola.','Financeiro'],
['sorteio','🎁','Sorteador de nomes','Sorteie um nome de uma lista.','Geradores'],

['variacao','📊','Variação percentual','Calcule aumento ou redução percentual.','Calculadoras'],
['combustivel','⛽','Custo de combustível','Estime o custo de uma viagem.','Financeiro'],
['ritmo','🏃','Calculadora de ritmo','Calcule o ritmo por quilômetro.','Calculadoras'],
['hora','💼','Salário por hora','Descubra quanto você ganha por hora.','Financeiro'],
['calorias','🔥','Estimativa de calorias','Estime seu gasto calórico diário.','Calculadoras'],
['inverter','🔁','Inverter texto','Inverta letras e frases rapidamente.','Texto'],
['slug','🔗','Gerador de slug','Transforme títulos em links amigáveis.','Desenvolvimento'],
['cor','🎨','Gerador de cor','Gere uma cor hexadecimal aleatória.','Geradores'],
['timestamp','🕰️','Conversor de timestamp','Converta data para timestamp e vice-versa.','Datas'],
['formatardata','📆','Formatador de data','Formate datas no padrão brasileiro.','Datas']
];

const R=id=>document.getElementById(id), val=id=>parseFloat(R(id)?.value)||0;
const grid=R('grid'), modal=R('modal'), tituloModal=R('tituloModal'), conteudoModal=R('conteudoModal');
let categoria='Todas', somenteFavoritos=false, ferramentaAtual=null;
let favoritos=JSON.parse(localStorage.getItem('fp_favoritos')||'[]');
let usos=JSON.parse(localStorage.getItem('fp_usos')||'{}');
let historico=JSON.parse(localStorage.getItem('fp_historico')||'[]');

function renderFilters(){
 const cats=['Todas',...new Set(ferramentas.map(f=>f[4]))];
 R('filters').innerHTML=cats.map(c=>`<button class="filter ${categoria===c?'active':''}" onclick="categoria='${c}';renderFilters();render()">${c}</button>`).join('');
}
function render(){
 const q=R('busca').value.toLowerCase();
 const lista=ferramentas.filter(f=>(categoria==='Todas'||f[4]===categoria)&&(!somenteFavoritos||favoritos.includes(f[0]))&&f.join(' ').toLowerCase().includes(q));
 grid.innerHTML=lista.length?'':`<div class="empty">Nenhuma ferramenta encontrada.</div>`;
 lista.forEach(f=>{
   const el=document.createElement('article');el.className='card';
   el.innerHTML=`<button class="fav" onclick="event.stopPropagation();toggleFav('${f[0]}')">${favoritos.includes(f[0])?'★':'☆'}</button><div class="emoji">${f[1]}</div><h3>${f[2]}</h3><p>${f[3]}</p><span class="tag">${f[4]}</span><span class="usage">${usos[f[0]]||0} usos</span>`;
   el.onclick=()=>abrir(f[0]);grid.appendChild(el);
 });
}
function toggleFav(id){favoritos=favoritos.includes(id)?favoritos.filter(x=>x!==id):[...favoritos,id];localStorage.setItem('fp_favoritos',JSON.stringify(favoritos));render()}
function addHistory(id){
 historico=[id,...historico.filter(x=>x!==id)].slice(0,6);
 usos[id]=(usos[id]||0)+1;
 localStorage.setItem('fp_historico',JSON.stringify(historico));
 localStorage.setItem('fp_usos',JSON.stringify(usos));
 renderHistory();renderPopular();render();
}

function renderPopular(){
 const lista=[...ferramentas].sort((a,b)=>(usos[b[0]]||0)-(usos[a[0]]||0)).slice(0,6);
 const el=R('popularList');
 el.innerHTML=lista.map((f,i)=>`<button class="popular-item" onclick="abrir('${f[0]}')"><strong>${i+1}. ${f[1]} ${f[2]}</strong><small>${usos[f[0]]||0} usos neste aparelho</small></button>`).join('');
}

function renderHistory(){
 const el=R('historyList');
 if(!historico.length){el.textContent='Nenhuma ferramenta usada ainda.';return}
 el.innerHTML=historico.map(id=>{const f=ferramentas.find(x=>x[0]===id);return f?`<button onclick="abrir('${id}')">${f[1]} ${f[2]}</button>`:''}).join('');
}
function abrir(id){
 const f=ferramentas.find(x=>x[0]===id);ferramentaAtual=f;
 tituloModal.textContent=f[2];conteudoModal.innerHTML=templates[id]();modal.classList.add('open');modal.setAttribute('aria-hidden','false');addHistory(id);if(init[id])init[id]();
 history.replaceState(null,'',`#${id}`);
}
function fechar(){modal.classList.remove('open');modal.setAttribute('aria-hidden','true');history.replaceState(null,'',location.pathname)}
R('fechar').onclick=fechar;modal.onclick=e=>{if(e.target===modal)fechar()};document.addEventListener('keydown',e=>{if(e.key==='Escape')fechar()});
R('busca').oninput=render;
R('favoritosBtn').onclick=()=>{somenteFavoritos=!somenteFavoritos;R('favoritosBtn').textContent=somenteFavoritos?'⭐✓':'⭐';render()};
R('tema').onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem('fp_tema',document.body.classList.contains('dark')?'dark':'light');R('tema').textContent=document.body.classList.contains('dark')?'☀️':'🌙'};
if(localStorage.getItem('fp_tema')==='dark'){document.body.classList.add('dark');R('tema').textContent='☀️'}

function resultadoTexto(){return conteudoModal.querySelector('.result')?.innerText||'Use a ferramenta para gerar um resultado.'}
R('copiarBtn').onclick=async()=>{try{await navigator.clipboard.writeText(resultadoTexto());alert('Resultado copiado!')}catch{alert('Não foi possível copiar.')}};
R('compartilharBtn').onclick=async()=>{const text=`${ferramentaAtual?.[2]}: ${resultadoTexto()}`;if(navigator.share){try{await navigator.share({title:'Ferramentas Pro',text,url:location.href})}catch{}}else{window.open(`https://wa.me/?text=${encodeURIComponent(text+' '+location.href)}`,'_blank')}};

const out=(id,t)=>R(id).innerHTML=t;
const templates={
imc:()=>`<div class="row"><div><label>Peso (kg)</label><input id="pesoImc" type="number" step="0.1"></div><div><label>Altura (m)</label><input id="alturaImc" type="number" step="0.01"></div></div><button class="btn" onclick="calcIMC()">Calcular</button><div id="rImc" class="result"></div>`,
porcentagem:()=>`<label>Porcentagem</label><input id="pct" type="number"><label>Valor</label><input id="base" type="number"><button class="btn" onclick="out('rPct',pct.value+'% de '+base.value+' = '+(val('pct')*val('base')/100).toFixed(2))">Calcular</button><div id="rPct" class="result"></div>`,
desconto:()=>`<div class="row"><input id="preco" type="number" placeholder="Preço"><input id="desc" type="number" placeholder="Desconto %"></div><button class="btn" onclick="calcDesc()">Calcular</button><div id="rDesc" class="result"></div>`,
regra3:()=>`<div class="row3"><input id="a3" placeholder="A" type="number"><input id="b3" placeholder="B" type="number"><input id="c3" placeholder="C" type="number"></div><button class="btn" onclick="out('rR3',val('a3')?'X = '+(val('b3')*val('c3')/val('a3')).toFixed(4):'A não pode ser zero.')">Calcular</button><div id="rR3" class="result"></div>`,
juros:()=>`<div class="row3"><input id="cap" type="number" placeholder="Capital"><input id="taxa" type="number" placeholder="Taxa mensal %"><input id="meses" type="number" placeholder="Meses"></div><button class="btn" onclick="calcJuros()">Calcular</button><div id="rJuros" class="result"></div>`,
emprestimo:()=>`<div class="row3"><input id="ev" type="number" placeholder="Valor"><input id="ei" type="number" placeholder="Juros ao mês %"><input id="en" type="number" placeholder="Parcelas"></div><button class="btn" onclick="calcEmp()">Calcular</button><div id="rEmp" class="result"></div>`,
idade:()=>`<label>Data de nascimento</label><input id="nasc" type="date"><button class="btn" onclick="calcIdade()">Calcular</button><div id="rIdade" class="result"></div>`,
dias:()=>`<div class="row"><input id="d1" type="date"><input id="d2" type="date"></div><button class="btn" onclick="calcDias()">Calcular</button><div id="rDias" class="result"></div>`,
caracteres:()=>`<textarea id="txtCar" placeholder="Digite seu texto..."></textarea><div id="rCar" class="result">0 caracteres</div>`,
palavras:()=>`<textarea id="txtPal" placeholder="Digite seu texto..."></textarea><div id="rPal" class="result">0 palavras</div>`,
maiusculas:()=>`<textarea id="txtMai"></textarea><button class="btn" onclick="txtMai.value=txtMai.value.toUpperCase()">MAIÚSCULAS</button> <button class="btn secondary" onclick="txtMai.value=txtMai.value.toLowerCase()">minúsculas</button><div class="result" id="rMai">O texto é alterado acima.</div>`,
espacos:()=>`<textarea id="txtEsp"></textarea><button class="btn" onclick="txtEsp.value=txtEsp.value.replace(/\\s+/g,' ').trim();out('rEsp',txtEsp.value)">Limpar espaços</button><div id="rEsp" class="result"></div>`,
ordenar:()=>`<textarea id="txtOrd" placeholder="Uma linha por item"></textarea><button class="btn" onclick="txtOrd.value=txtOrd.value.split('\\n').filter(Boolean).sort((a,b)=>a.localeCompare(b)).join('\\n');out('rOrd',txtOrd.value)">Ordenar A–Z</button><div id="rOrd" class="result"></div>`,
base64:()=>`<textarea id="txtB64"></textarea><button class="btn" onclick="b64enc()">Codificar</button> <button class="btn secondary" onclick="b64dec()">Decodificar</button><div id="rB64" class="result"></div>`,
url:()=>`<textarea id="txtUrl"></textarea><button class="btn" onclick="out('rUrl',encodeURIComponent(txtUrl.value))">Codificar</button> <button class="btn secondary" onclick="urlDec()">Decodificar</button><div id="rUrl" class="result"></div>`,
senha:()=>`<label>Tamanho</label><input id="tamSenha" type="number" value="16"><button class="btn" onclick="gerarSenha()">Gerar senha</button><div id="rSenha" class="result"></div>`,
uuid:()=>`<button class="btn" onclick="out('rUuid',crypto.randomUUID())">Gerar UUID</button><div id="rUuid" class="result"></div>`,
numero:()=>`<div class="row"><input id="nmin" type="number" value="1"><input id="nmax" type="number" value="100"></div><button class="btn" onclick="sortearNumero()">Sortear</button><div id="rNumero" class="result"></div>`,
loteria:()=>`<button class="btn" onclick="mega()">Gerar números</button><div id="rMega" class="result"></div>`,
cpfgerar:()=>`<button class="btn" onclick="out('rCpfG',gerarCPF())">Gerar CPF</button><div id="rCpfG" class="result"></div>`,
cpfvalidar:()=>`<input id="cpfV" placeholder="Digite o CPF"><button class="btn" onclick="out('rCpfV',cpfValido(cpfV.value)?'CPF válido':'CPF inválido')">Validar</button><div id="rCpfV" class="result"></div>`,
temperatura:()=>convTemplate('temp'),comprimento:()=>convTemplate('comp'),peso:()=>convTemplate('peso'),dados:()=>convTemplate('dados'),
cronometro:()=>`<div id="tempoCrono" class="result" style="font-size:36px;text-align:center">00:00:00</div><button class="btn" onclick="cronoStart()">Iniciar</button> <button class="btn secondary" onclick="cronoPause()">Pausar</button> <button class="btn danger" onclick="cronoReset()">Zerar</button>`,
temporizador:()=>`<input id="segTimer" type="number" value="60"><div id="tempoTimer" class="result" style="font-size:36px;text-align:center">01:00</div><button class="btn" onclick="timerStart()">Iniciar</button> <button class="btn danger" onclick="timerStop()">Parar</button>`,
qrcode:()=>`<textarea id="qrTxt" placeholder="Texto ou link"></textarea><button class="btn" onclick="gerarQR()">Gerar QR Code</button><div id="rQr" class="result" style="text-align:center"></div>`,
pix:()=>`<input id="pixChave" placeholder="Chave PIX"><div class="row"><input id="pixNome" maxlength="25" placeholder="Nome"><input id="pixCidade" maxlength="15" placeholder="Cidade"></div><input id="pixValor" type="number" step="0.01" placeholder="Valor opcional"><button class="btn" onclick="gerarPix()">Gerar código</button><div id="rPix" class="result"></div>`,
sorteio:()=>`<textarea id="nomes" placeholder="Um nome por linha"></textarea><button class="btn" onclick="sortearNome()">Sortear nome</button><div id="rNome" class="result"></div>`

,variacao:()=>`<div class="row"><input id="vInicial" type="number" placeholder="Valor inicial"><input id="vFinal" type="number" placeholder="Valor final"></div><button class="btn" onclick="calcVariacao()">Calcular</button><div id="rVariacao" class="result"></div>`
,combustivel:()=>`<div class="row3"><input id="dist" type="number" placeholder="Distância (km)"><input id="consumo" type="number" placeholder="Km por litro"><input id="precoComb" type="number" step="0.01" placeholder="Preço do litro"></div><button class="btn" onclick="calcCombustivel()">Calcular</button><div id="rComb" class="result"></div>`
,ritmo:()=>`<div class="row3"><input id="ritmoKm" type="number" step="0.01" placeholder="Distância (km)"><input id="ritmoH" type="number" placeholder="Horas"><input id="ritmoM" type="number" placeholder="Minutos"></div><button class="btn" onclick="calcRitmo()">Calcular</button><div id="rRitmo" class="result"></div>`
,hora:()=>`<div class="row"><input id="salario" type="number" placeholder="Salário mensal"><input id="horasSemana" type="number" value="44" placeholder="Horas por semana"></div><button class="btn" onclick="calcHora()">Calcular</button><div id="rHora" class="result"></div>`
,calorias:()=>`<div class="row3"><input id="calPeso" type="number" placeholder="Peso (kg)"><input id="calAltura" type="number" placeholder="Altura (cm)"><input id="calIdade" type="number" placeholder="Idade"></div><select id="calSexo"><option value="m">Masculino</option><option value="f">Feminino</option></select><select id="calAtiv"><option value="1.2">Sedentário</option><option value="1.375">Atividade leve</option><option value="1.55">Atividade moderada</option><option value="1.725">Muito ativo</option></select><button class="btn" onclick="calcCalorias()">Estimar</button><div id="rCalorias" class="result"></div>`
,inverter:()=>`<textarea id="txtInv" placeholder="Digite o texto..."></textarea><button class="btn" onclick="out('rInv',txtInv.value.split('').reverse().join(''))">Inverter</button><div id="rInv" class="result"></div>`
,slug:()=>`<textarea id="txtSlug" placeholder="Digite um título..."></textarea><button class="btn" onclick="gerarSlug()">Gerar slug</button><div id="rSlug" class="result"></div>`
,cor:()=>`<button class="btn" onclick="gerarCor()">Gerar cor</button><div id="rCor" class="result" style="font-size:26px;text-align:center"></div>`
,timestamp:()=>`<label>Data e hora</label><input id="tsData" type="datetime-local"><button class="btn" onclick="dataParaTs()">Data → timestamp</button><label>Timestamp</label><input id="tsNumero" type="number" placeholder="Ex.: 1767225600"><button class="btn secondary" onclick="tsParaData()">Timestamp → data</button><div id="rTs" class="result"></div>`
,formatardata:()=>`<label>Escolha uma data</label><input id="fmtData" type="date"><button class="btn" onclick="formatarData()">Formatar</button><div id="rFmt" class="result"></div>`

};

function convTemplate(tipo){const o={temp:[['c','Celsius'],['f','Fahrenheit'],['k','Kelvin']],comp:[['m','Metros'],['km','Quilômetros'],['mi','Milhas']],peso:[['kg','Quilos'],['g','Gramas'],['lb','Libras']],dados:[['b','Bytes'],['kb','KB'],['mb','MB'],['gb','GB']]}[tipo].map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('');return `<input id="cv" type="number" placeholder="Valor"><div class="row"><select id="cde">${o}</select><select id="cpara">${o}</select></div><button class="btn" onclick="converter('${tipo}')">Converter</button><div id="rConv" class="result"></div>`}
const init={caracteres:()=>txtCar.oninput=()=>out('rCar',`${txtCar.value.length} caracteres • ${txtCar.value.replace(/\\s/g,'').length} sem espaços`),palavras:()=>txtPal.oninput=()=>{let t=txtPal.value.trim();out('rPal',`${t?t.split(/\\s+/).length:0} palavras • ${t?t.split(/\\n/).length:0} linhas`)},temporizador:()=>segTimer.oninput=()=>{timerSeg=Math.max(0,parseInt(segTimer.value)||0);mostrarTimer()}};

function calcIMC(){let p=val('pesoImc'),a=val('alturaImc');if(!p||!a)return out('rImc','Preencha peso e altura.');let i=p/(a*a),c=i<18.5?'Abaixo do peso':i<25?'Peso normal':i<30?'Sobrepeso':i<35?'Obesidade grau I':i<40?'Obesidade grau II':'Obesidade grau III';out('rImc',`IMC: ${i.toFixed(2)} — ${c}`)}
function calcDesc(){let p=val('preco'),d=val('desc'),f=p*(1-d/100);out('rDesc',`Preço final: R$ ${f.toFixed(2)}\\nEconomia: R$ ${(p-f).toFixed(2)}`)}
function calcJuros(){let c=val('cap'),i=val('taxa')/100,n=val('meses'),m=c*Math.pow(1+i,n);out('rJuros',`Montante: R$ ${m.toFixed(2)}\\nJuros: R$ ${(m-c).toFixed(2)}`)}
function calcEmp(){let p=val('ev'),i=val('ei')/100,n=val('en');if(!n)return;let x=i?p*i*Math.pow(1+i,n)/(Math.pow(1+i,n)-1):p/n;out('rEmp',`Parcela: R$ ${x.toFixed(2)}\\nTotal: R$ ${(x*n).toFixed(2)}`)}
function calcIdade(){let n=new Date(nasc.value+'T00:00:00'),h=new Date();if(isNaN(n))return;let a=h.getFullYear()-n.getFullYear();if(h<new Date(h.getFullYear(),n.getMonth(),n.getDate()))a--;out('rIdade',`${a} anos`)}
function calcDias(){let a=new Date(d1.value),b=new Date(d2.value);out('rDias',isNaN(a)||isNaN(b)?'Escolha as duas datas.':`${Math.abs(Math.round((b-a)/86400000))} dias`)}
function b64enc(){try{out('rB64',btoa(unescape(encodeURIComponent(txtB64.value))))}catch{out('rB64','Não foi possível codificar.')}}
function b64dec(){try{out('rB64',decodeURIComponent(escape(atob(txtB64.value))))}catch{out('rB64','Base64 inválido.')}}
function urlDec(){try{out('rUrl',decodeURIComponent(txtUrl.value))}catch{out('rUrl','URL inválida.')}}
function gerarSenha(){let n=Math.max(4,Math.min(100,parseInt(tamSenha.value)||16)),chars='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%&*_-+=',a=new Uint32Array(n);crypto.getRandomValues(a);out('rSenha',Array.from(a,x=>chars[x%chars.length]).join(''))}
function sortearNumero(){let a=Math.ceil(val('nmin')),b=Math.floor(val('nmax'));if(a>b)[a,b]=[b,a];out('rNumero',String(Math.floor(Math.random()*(b-a+1))+a))}
function mega(){let s=new Set();while(s.size<6)s.add(Math.floor(Math.random()*60)+1);out('rMega',[...s].sort((a,b)=>a-b).map(n=>String(n).padStart(2,'0')).join(' • '))}
function gerarCPF(){let n=Array.from({length:9},()=>Math.floor(Math.random()*10));for(let t=9;t<=10;t++){let s=0;for(let i=0;i<t;i++)s+=n[i]*(t+1-i);let d=(s*10)%11;n.push(d===10?0:d)}return n.join('').replace(/(\\d{3})(\\d{3})(\\d{3})(\\d{2})/,'$1.$2.$3-$4')}
function cpfValido(cpf){cpf=cpf.replace(/\\D/g,'');if(cpf.length!==11||/^(\\d)\\1+$/.test(cpf))return false;for(let t=9;t<11;t++){let s=0;for(let i=0;i<t;i++)s+=+cpf[i]*(t+1-i);let d=(s*10)%11;if(d===10)d=0;if(d!==+cpf[t])return false}return true}
function converter(tipo){let v=val('cv'),de=cde.value,para=cpara.value,r=v;if(tipo==='temp'){let c=de==='c'?v:de==='f'?(v-32)*5/9:v-273.15;r=para==='c'?c:para==='f'?c*9/5+32:c+273.15}else{let f={comp:{m:1,km:1000,mi:1609.344},peso:{kg:1,g:.001,lb:.45359237},dados:{b:1,kb:1024,mb:1048576,gb:1073741824}}[tipo];r=v*f[de]/f[para]}out('rConv',String(Number(r.toFixed(8))))}
let cronoInt=null,cronoInicio=0,cronoPassado=0;function cronoStart(){if(cronoInt)return;cronoInicio=Date.now()-cronoPassado;cronoInt=setInterval(()=>{cronoPassado=Date.now()-cronoInicio;let s=Math.floor(cronoPassado/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60);tempoCrono.textContent=[h,m,s%60].map(x=>String(x).padStart(2,'0')).join(':')},250)}function cronoPause(){clearInterval(cronoInt);cronoInt=null}function cronoReset(){cronoPause();cronoPassado=0;if(R('tempoCrono'))tempoCrono.textContent='00:00:00'}
let timerInt=null,timerSeg=60;function mostrarTimer(){if(R('tempoTimer'))tempoTimer.textContent=`${String(Math.floor(timerSeg/60)).padStart(2,'0')}:${String(timerSeg%60).padStart(2,'0')}`}function timerStart(){timerStop();timerSeg=Math.max(0,parseInt(segTimer.value)||0);mostrarTimer();timerInt=setInterval(()=>{timerSeg--;mostrarTimer();if(timerSeg<=0){timerStop();alert('Tempo encerrado!')}},1000)}function timerStop(){clearInterval(timerInt);timerInt=null}
function gerarQR(){let t=encodeURIComponent(qrTxt.value.trim());if(!t)return;out('rQr',`<img alt="QR Code" style="max-width:260px;width:100%" src="https://quickchart.io/qr?text=${t}&size=300">`)}
function crc16(str){let crc=0xFFFF;for(let c of str){crc^=c.charCodeAt(0)<<8;for(let i=0;i<8;i++)crc=(crc&0x8000)?((crc<<1)^0x1021):(crc<<1);crc&=0xFFFF}return crc.toString(16).toUpperCase().padStart(4,'0')}
function emv(id,v){return id+String(v.length).padStart(2,'0')+v}
function gerarPix(){let chave=pixChave.value.trim(),nome=pixNome.value.trim().toUpperCase().slice(0,25),cidade=pixCidade.value.trim().toUpperCase().slice(0,15),valor=parseFloat(pixValor.value);if(!chave||!nome||!cidade)return out('rPix','Preencha chave, nome e cidade.');let gui=emv('00','BR.GOV.BCB.PIX'),conta=emv('26',gui+emv('01',chave)),p=emv('00','01')+emv('01','12')+conta+emv('52','0000')+emv('53','986');if(valor>0)p+=emv('54',valor.toFixed(2));p+=emv('58','BR')+emv('59',nome)+emv('60',cidade)+emv('62',emv('05','***'))+'6304';out('rPix',p+crc16(p))}

function calcVariacao(){let a=val('vInicial'),b=val('vFinal');if(!a)return out('rVariacao','O valor inicial não pode ser zero.');let p=(b-a)/a*100;out('rVariacao',`${p>=0?'Aumento':'Redução'} de ${Math.abs(p).toFixed(2)}%`)}
function calcCombustivel(){let d=val('dist'),c=val('consumo'),p=val('precoComb');if(!d||!c||!p)return out('rComb','Preencha todos os campos.');let l=d/c;out('rComb',`Combustível: ${l.toFixed(2)} litros\nCusto estimado: R$ ${(l*p).toFixed(2)}`)}
function calcRitmo(){let km=val('ritmoKm'),min=val('ritmoH')*60+val('ritmoM');if(!km||!min)return out('rRitmo','Preencha distância e tempo.');let ritmo=min/km,m=Math.floor(ritmo),s=Math.round((ritmo-m)*60);out('rRitmo',`Ritmo médio: ${m}:${String(s).padStart(2,'0')} min/km`)}
function calcHora(){let s=val('salario'),h=val('horasSemana');if(!s||!h)return out('rHora','Preencha os campos.');out('rHora',`Valor aproximado por hora: R$ ${(s/(h*4.33)).toFixed(2)}`)}
function calcCalorias(){let p=val('calPeso'),a=val('calAltura'),i=val('calIdade');if(!p||!a||!i)return out('rCalorias','Preencha peso, altura e idade.');let basal=calSexo.value==='m'?(10*p+6.25*a-5*i+5):(10*p+6.25*a-5*i-161);out('rCalorias',`Metabolismo basal: ${Math.round(basal)} kcal/dia\nGasto diário estimado: ${Math.round(basal*parseFloat(calAtiv.value))} kcal/dia`)}
function gerarSlug(){let s=txtSlug.value.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');out('rSlug',s)}
function gerarCor(){let c='#'+Math.floor(Math.random()*16777215).toString(16).padStart(6,'0').toUpperCase();R('rCor').innerHTML=`<div style="height:90px;border-radius:12px;background:${c};margin-bottom:10px"></div>${c}`}
function dataParaTs(){let d=new Date(tsData.value);out('rTs',isNaN(d)?'Escolha uma data válida.':String(Math.floor(d.getTime()/1000)))}
function tsParaData(){let n=parseInt(tsNumero.value);if(!n)return out('rTs','Digite um timestamp válido.');out('rTs',new Date(n*1000).toLocaleString('pt-BR'))}
function formatarData(){let d=new Date(fmtData.value+'T00:00:00');out('rFmt',isNaN(d)?'Escolha uma data válida.':d.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'}))}

function sortearNome(){let a=nomes.value.split('\\n').map(x=>x.trim()).filter(Boolean);out('rNome',a.length?`🎉 ${a[Math.floor(Math.random()*a.length)]}`:'Adicione pelo menos um nome.')}

renderFilters();render();renderHistory();renderPopular();
const hash=location.hash.replace('#','');if(ferramentas.some(f=>f[0]===hash))setTimeout(()=>abrir(hash),100);
</script>
